version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: kanggo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-kanggo_tasks}
      MYSQL_USER: ${DB_USER:-kanggo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kanggo_password}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kanggo_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-kanggo_user}
      DB_PASSWORD: ${DB_PASSWORD:-kanggo_password}
      DB_NAME: ${DB_NAME:-kanggo_tasks}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_random_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '5000:5000'

volumes:
  mysql_data:
